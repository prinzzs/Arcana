    <main class="simple-page">
        <h1>Criar perfil local</h1>
        <p class="local-notice">Versão local de demonstração. Os dados ficam neste navegador; não há autenticação ou sincronização online.</p>
        <p id="status" role="status" aria-live="polite"></p>
        <form data-profile><label>Nome<input name="name" required maxlength="100"></label><label>E-mail de demonstração<input name="email" type="email" required maxlength="120"></label><button>Salvar perfil local</button></form><a href="login.html">Escolher um perfil existente</a>
    </main>
